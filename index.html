<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101822" />
  <title>Dragon Realm</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="crest" aria-hidden="true">DR</div>
        <div><h1>Dragon Realm</h1><p>Emberfall Isle</p></div>
      </div>
      <div class="resources" aria-label="Resources">
        <div><span>Gold</span><strong id="goldValue">0</strong></div>
        <div><span>Food</span><strong id="foodValue">0</strong></div>
        <div><span>Gems</span><strong id="gemsValue">0</strong></div>
      </div>
    </header>

    <main class="layout">
      <section class="panel island-panel">
        <div class="panel-head">
          <div><p class="eyebrow">Stable Web v1</p><h2>Your Island</h2></div>
          <div class="level-box"><span>Realm Lv.</span><strong id="levelValue">1</strong></div>
        </div>
        <div class="xp-wrap"><div id="xpBar" class="xp-bar"></div></div>
        <div class="xp-label"><span id="xpValue">0</span> / <span id="xpNeed">100</span> XP</div>

        <div id="islandGrid" class="island-grid" aria-label="Island building grid"></div>

        <div class="actions-row">
          <button id="collectGoldBtn" class="primary">Collect Gold</button>
          <button id="harvestBtn">Harvest Farms</button>
          <button id="resetBtn" class="danger">Reset Save</button>
        </div>
        <p id="statusMessage" class="status" aria-live="polite"></p>
      </section>

      <aside class="side-column">
        <section class="panel">
          <div class="panel-head"><div><p class="eyebrow">Construction</p><h2>Build</h2></div></div>
          <div id="buildMenu" class="build-menu"></div>
          <p class="hint">Choose a building, then click an empty island tile.</p>
        </section>

        <section class="panel">
          <div class="panel-head"><div><p class="eyebrow">Collection</p><h2>Dragons</h2></div><span id="dragonCount" class="badge">0</span></div>
          <div id="dragonList" class="dragon-list"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="js/dragons.js"></script>
  <script src="js/save.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/island.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
